name: Validate Godot

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: ["feature/**", "fix/**", develop]

permissions:
  contents: read

jobs:
  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned engine
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.1-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 --headless --path . --editor --import
      - name: Gameplay and integration tests
        env:
          GODOT_BIN: /tmp/godot/Godot_v4.6.1-stable_linux.x86_64
        run: bash scripts/test.sh
      - name: Whitespace validation
        run: git diff --check
